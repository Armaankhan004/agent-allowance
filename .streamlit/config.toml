# ==============================================================================
# Agent Allowance — Streamlit Configuration (v4 Calm Neutral Palette)
# Mirrors TOKENS defined in agent_allowance/ui_theme.py:
#   canvas #FAFAF9, surface #FFFFFF, border #E7E5E4, stronger border #D6D3D1,
#   divider #F0EFED, ink #1C1917, secondary #57534E, muted #78716C,
#   plum accent #4A3357, active nav bg #F3EFF5
# ==============================================================================

[theme]
base = "light"
primaryColor = "#1C1917"
backgroundColor = "#FAFAF9"
# Keep secondaryBackgroundColor light (#FFFFFF) so input widgets stay light and readable
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1C1917"
borderColor = "#E7E5E4"
showWidgetBorder = true
showSidebarBorder = true
linkColor = "#4A3357"
baseRadius = "10px"
buttonRadius = "7px"
font = "system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
headingFont = "system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
baseFontWeight = 400
headingFontWeights = 500
codeBackgroundColor = "#F5F5F4"
codeTextColor = "#1C1917"
dataframeHeaderBackgroundColor = "#F5F5F4"
dataframeHeaderTextColor = "#1C1917"
dataframeBorderColor = "#E7E5E4"

# Semantic status palette mirrored from TOKENS
greenColor = "#5E9B6E"
greenBackgroundColor = "#EEF5EF"
greenTextColor = "#2F6B3E"
orangeColor = "#C79A3B"
orangeBackgroundColor = "#FBF5E8"
orangeTextColor = "#8A5A12"
redColor = "#B45454"
redBackgroundColor = "#FBEFEF"
redTextColor = "#9B3B3B"
grayColor = "#A8A29E"
grayBackgroundColor = "#F5F5F4"
grayTextColor = "#57534E"

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#FAFAF9"
textColor = "#1C1917"
primaryColor = "#4A3357"
borderColor = "#E7E5E4"
linkColor = "#4A3357"
codeBackgroundColor = "#F5F5F4"
codeTextColor = "#1C1917"

[client]
toolbarMode = "minimal"
showErrorDetails = "none"

[browser]
gatherUsageStats = false
